services:
  backend:
    env_file: .env
    environment:
      ENV: prod
      DEBUG: True # This should be false but keeping true for now otherwise we have to define the allowed hosts or django complains
    depends_on:
      - db

  db:
      image: postgres:15
      env_file: .env
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: